        - figure [ref=e354]:
          - blockquote [ref=e358]: Es la única cantante en español en colocar todos los temas de un disco en el top 10 de la revista Billboard, en este caso el álbum debut de Marisela Sin él (1984).
          - link "Wikipedia (es)" [ref=e361] [cursor=pointer]:
