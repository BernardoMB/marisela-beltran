        - figure [ref=e363]:
          - blockquote [ref=e367]: Her debut album, Sin Él, entered at No. 16 on the first Billboard Latin Albums Chart.
          - link "Wikipedia (en)" [ref=e370] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Marisela
        - figure [ref=e372]:
          - blockquote [ref=e376]: En el año 2010 fue nominada en tres categorías a los Premios Billboard de la Música Latina, siendo ganadora de dos de ellos por su disco recopilación 20 éxitos inmortales. En 2011, regresa a la música con El marco de mis recuerdos.
          - link "Wikipedia (es)" [ref=e379] [cursor=pointer]:
            - /url: https://es.wikipedia.org/wiki/Marisela_(cantante)
        - figure [ref=e381]:
          - blockquote [ref=e385]: Her debut album, Sin Él (1984), was produced by Marco Antonio Solís and included the title track as its lead single.
