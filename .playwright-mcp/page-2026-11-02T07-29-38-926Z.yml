      - generic [ref=e319]:
        - paragraph [ref=e320]: Biografía
        - heading "Su historia" [level=2] [ref=e321]
        - paragraph [ref=e322]: Marisela Esqueda, conocida simplemente como Marisela; es una cantante, actriz y empresaria mexicoestadounidense. También es conocida como "La dama de hierro".
        - generic [ref=e323]:
          - paragraph [ref=e324]: Marisela, la única e indiscutible Dama de Hierro, nace en 1966, en Estados Unidos, sin embargo, Marisela la cantante nace y se hace en México, país que le dio la fama desde que llego por primera vez en 1984. Con una voz única y auténtica ha logrado permanecer en el gusto del público a través de los años, siendo sin duda alguna una consentida de la euforia popular a través de varias generaciones.
          - paragraph [ref=e325]: Su primera producción de la mano de Marco Antonio Solís, "El Buki", quien le graba el disco "Sin él" la hizo debutar en el programa de Siempre en Domingo, de la mano de su padrino, Raúl Velasco. De este trabajo se desprenden diez sencillos que se colocaron todos sin excepción en el primer lugar de popularidad no sólo en México sino en todo Hispanoamérica. Esto se vuelve un record que aun a la fecha es prácticamente imposible de igualar.
          - paragraph [ref=e326]: "Algunos de los temas que la gente aún no olvida son: “Ya no te vayas”, “El Chico Aquel” “Si no te hubieras ido”, el emblemático tema que dio nombre al disco y es un himno de la música en español, “Sin él”, y el dueto mas importante de la década, “La Pareja Ideal” en donde unieron sus voces, Marisela y su entonces novio y compositor del disco, “El Buki”."
        - button "Leer más" [ref=e327]
        - paragraph [ref=e328]: "Texto basado en el sitio oficial y Wikipedia (es) (Wikipedia: CC BY-SA 4.0)."
